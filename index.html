    <script src="js/turn.min.js"></script>
</head>
<body>

<div class="book-container">
    <div id="flipbook">

        <div style="background-image:url('images/img8.png')"></div>
        <div style="background-image:url('images/img9.png')"></div>
        <div style="background-image:url('images/img10.png')"></div>
        <div style="background-image:url('images/img11.png')"></div>
        <div style="background-image:url('images/img12.png')"></div>
        <div style="background-image:url('images/img13.png')"></div>
        <div style="background-image:url('images/img14.png')"></div>
        <div style="background-image:url('images/img15.png')"></div>
        <div style="background-image:url('images/img16.png')"></div>

        <div style="background-image:url('images/img18.png')"></div>

        <div style="background-image:url('images/img35.png')"></div>
        <div class="hard" style="background-image:url('images/img36.png')"></div>
    </div>
</div>

<audio id="audio-player" src="audio/3-6.mp3"></audio>

<script>
    $("#flipbook").turn({
        width: 1000,
        height: 600,
        autoCenter: true,
        display: 'double',
        acceleration: true,
        when: {
            turning: function(event, page, view) {
                controlMusica(page);
            }
        }
    });

    function controlMusica(page) {
        const player = document.getElementById('audio-player');
        let nuevaCancion = "";

        // Lógica de canciones:
        if (page <= 2) {
            nuevaCancion = "audio/3-6.mp3"; // Canción 1 para portada y pág 2
        } else if (page > 2 && page <= 6) {
            nuevaCancion = "audio/7-8.mp3"; // Canción 2 para páginas 3, 4, 5 y 6
        } else {
            nuevaCancion = "audio/23-24.mp3"; // Canción 3 para el resto
        }

        cambiarSrc(player, nuevaCancion);
    }

    function cambiarSrc(player, src) {
        // Solo cambia y reinicia si la canción es distinta a la que ya suena
        if (!player.src.includes(src)) {
            player.src = src;
            player.play().catch(error => {
                console.log("El navegador bloqueó el autoplay. Sonará al interactuar.");
            });
        }
    }
</script>

</body>
</html>
