    </div>
</div>

<audio id="audio-player" src="audio/3-6.mp3"></audio>

<script>
    // 1. Configuraciones iniciales
    const esMovil = window.innerWidth < 800;

    // 2. Definir el reproductor (Aseguramos que sea global)
    const player = document.getElementById('audio-player');

    // 3. Función de desbloqueo de audio
    function activarAudio() {
        if (player) {
            player.play().catch(e => console.log("Esperando interacción..."));
        }
        document.removeEventListener('click', activarAudio);
        document.removeEventListener('touchstart', activarAudio);
    }
    document.addEventListener('click', activarAudio);
    document.addEventListener('touchstart', activarAudio);

    // 4. Inicializar Flipbook
    $("#flipbook").turn({
        width: esMovil ? window.innerWidth * 0.95 : 842,
        height: esMovil ? (window.innerWidth * 0.95) * 1.41 : 595,
        autoCenter: true,
        display: esMovil ? 'single' : 'double',
        acceleration: true,
        elevation: 50,
        when: {
            turning: function(event, page, view) {
                // El try/catch evita que el libro se congele si la música falla
                try {
                    controlMusica(page);
                } catch (e) {
                    console.error("Error en controlMusica:", e);
                }
            }
        }
    });

    // 5. Función de control de música corregida
    function controlMusica(page) {
        // Verificación extra: si por alguna razón 'player' no existe, abortamos
        const audio = document.getElementById('audio-player');
        if (!audio) return;

        let nuevaCancion = "";

        // Lógica de tus páginas
        if (page <= 3) {
            nuevaCancion = "Vals.mp3"; 
        } 
        else if (page >= 4 && page <= 7) {
            nuevaCancion = "audio/3-6.mp3";
        } 
        else if (page >= 8 && page <= 11) {
            nuevaCancion = "audio/7-8.mp3";
        } 
        else if (page >= 12 && page <= 23) {
            nuevaCancion = "Vals.mp3";
        }
        else if (page >= 24 && page <= 27) {
            nuevaCancion = "audio/23-24.mp3";
        }
        else {
            nuevaCancion = "0.mp3";
        }

        // Comparar solo el nombre del archivo para evitar líos con rutas completas
        const actual = audio.src.split('/').pop();
        const destino = nuevaCancion.split('/').pop();

        if (actual !== destino) {
            audio.src = nuevaCancion;
            audio.load();
            audio.play().catch(err => console.log("Reproducción bloqueada por navegador"));
        }
    }
</script>
    
</body>
