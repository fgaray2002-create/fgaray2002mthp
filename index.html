<audio id="audio-player" src="audio/3-6.mp3"></audio>

<script>
    const esMovil = window.innerWidth < 800;
    // IMPORTANTE: Definimos 'player' fuera para que todas las funciones lo vean
    const player = document.getElementById('audio-player');

    // Desbloqueo de audio para navegadores (clic en cualquier parte)
    function activarAudio() {
        player.play().catch(e => console.log("Esperando clic para sonar..."));
        document.removeEventListener('click', activarAudio);
        document.removeEventListener('touchstart', activarAudio);
    }
    document.addEventListener('click', activarAudio);
    document.addEventListener('touchstart', activarAudio);

    $("#flipbook").turn({
        width: esMovil ? window.innerWidth * 0.95 : 842,
        height: esMovil ? (window.innerWidth * 0.95) * 1.41 : 595,
        autoCenter: true,
        display: esMovil ? 'single' : 'double',
        acceleration: true,
        elevation: 50,
        when: {
            turning: function(event, page, view) {
                controlMusica(page);
            }
        }
    });

    function controlMusica(page) {
        let nuevaCancion = "";

        // Ajuste de rangos según lo que pediste
        if (page <= 3) {
            nuevaCancion = "Vals.mp3"; // Agregué 'audio/' si es que está en esa carpeta
        } 
        else if (page >= 4 && page <= 7) {
            nuevaCancion = "audio/3-6.mp3";
        } 
        else if (page >= 8 && page <= 11) {
            nuevaCancion = "audio/7-8.mp3";
        } 
        else if (page >= 12 && page <= 23) {
            nuevaCancion = "Vals.mp3";
        }
        else if (page >= 24 && page <= 27) {
            nuevaCancion = "audio/23-24.mp3";
        }
        else if (page >= 28) {
            nuevaCancion = "0.mp3"; // Agregué 'audio/' para mantener consistencia
        }

        // Verificación de seguridad para que no falle el paso de página
        if (player && nuevaCancion !== "") {
            // Solo cambia si la canción es distinta a la actual
            if (!player.src.endsWith(nuevaCancion)) {
                player.src = nuevaCancion;
                player.play().catch(e => console.log("El audio sonará al interactuar"));
            }
        }
    }
</script>
