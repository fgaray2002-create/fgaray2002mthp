<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Feliz Cumpleaños</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/turn.min.js"></script>
</head>
<body>

<div class="book-container">
    <div id="flipbook">
        <div class="hard" style="background-image:url('1.png')"></div>
        <div style="background-image:url('1.2.png')"></div>

        <div style="background-image:url('3.png')"></div>
        <div style="background-image:url('4.png')"></div>
        <div style="background-image:url('5.png')"></div>
        <div style="background-image:url('6.png')"></div>
        <div style="background-image:url('7.png')"></div>
        <div style="background-image:url('8.png')"></div>
        <div style="background-image:url('9.png')"></div>
        <div style="background-image:url('10.png')"></div>
        <div style="background-image:url('11.png')"></div>
        <div style="background-image:url('12.png')"></div>
        <div style="background-image:url('13.png')"></div>
        <div style="background-image:url('14.png')"></div>
        <div style="background-image:url('15.png')"></div>
        <div style="background-image:url('16.png')"></div>
        <div style="background-image:url('17.png')"></div>
        <div style="background-image:url('18.png')"></div>
        <div style="background-image:url('19.png')"></div>
        <div style="background-image:url('20.png')"></div>
        <div style="background-image:url('21.png')"></div>
        <div style="background-image:url('22.png')"></div>
        <div style="background-image:url('23.png')"></div>
        <div style="background-image:url('24.png')"></div>
        <div style="background-image:url('25.png')"></div>
        <div style="background-image:url('26.png')"></div>
        <div style="background-image:url('27.png')"></div>
        <div style="background-image:url('28.png')"></div>
        <div style="background-image:url('29.png')"></div>
        <div style="background-image:url('30.png')"></div>
        <div style="background-image:url('31.png')"></div>
        <div style="background-image:url('32.png')"></div>
        <div style="background-image:url('33.png')"></div>
        <div style="background-image:url('34.png')"></div>
        <div style="background-image:url('35.png')"></div>
        <div class="hard" style="background-image:url('36.png')"></div>
    </div>
</div>

<audio id="audio-player" src="audio/3-6.mp3"></audio>

<script>
    // 1. Configuraciones iniciales
    const esMovil = window.innerWidth < 800;

    // 2. Definir el reproductor (Aseguramos que sea global)
    const player = document.getElementById('audio-player');

    // 3. Función de desbloqueo de audio
    function activarAudio() {
        if (player) {
            player.play().catch(e => console.log("Esperando interacción..."));
        }
        document.removeEventListener('click', activarAudio);
        document.removeEventListener('touchstart', activarAudio);
    }
    document.addEventListener('click', activarAudio);
    document.addEventListener('touchstart', activarAudio);

    // 4. Inicializar Flipbook
    $("#flipbook").turn({
        width: esMovil ? window.innerWidth * 0.95 : 842,
        height: esMovil ? (window.innerWidth * 0.95) * 1.41 : 595,
        autoCenter: true,
        display: esMovil ? 'single' : 'double',
        acceleration: true,
        elevation: 50,
        when: {
            turning: function(event, page, view) {
                // El try/catch evita que el libro se congele si la música falla
                try {
                    controlMusica(page);
                } catch (e) {
                    console.error("Error en controlMusica:", e);
                }
            }
        }
    });

    // 5. Función de control de música corregida
    function controlMusica(page) {
        // Verificación extra: si por alguna razón 'player' no existe, abortamos
        const audio = document.getElementById('audio-player');
        if (!audio) return;

        let nuevaCancion = "";

        // Lógica de tus páginas
        if (page <= 3) {
            nuevaCancion = "Vals.mp3"; 
        } 
        else if (page >= 4 && page <= 7) {
            nuevaCancion = "audio/3-6.mp3";
        } 
        else if (page >= 8 && page <= 11) {
            nuevaCancion = "audio/7-8.mp3";
        } 
        else if (page >= 12 && page <= 23) {
            nuevaCancion = "Vals.mp3";
        }
        else if (page >= 24 && page <= 27) {
            nuevaCancion = "audio/23-24.mp3";
        }
        else {
            nuevaCancion = "0.mp3";
        }

        // Comparar solo el nombre del archivo para evitar líos con rutas completas
        const actual = audio.src.split('/').pop();
        const destino = nuevaCancion.split('/').pop();

        if (actual !== destino) {
            audio.src = nuevaCancion;
            audio.load();
            audio.play().catch(err => console.log("Reproducción bloqueada por navegador"));
        }
    }
</script>
    
</body>
</html>
